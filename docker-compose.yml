name: tickethub

# 9 个 Go 服务的公共片段。YAML 锚点（&）定义、别名（*）引用、<< 合并。
# 注意：environment 的优先级高于 env_file，所以下面的地址能覆盖 .env 里的 127.0.0.1。
x-app-env: &app-env
  TICKETHUB_ADAPTER_MODE: infra
  TICKETHUB_MYSQL_HOST: tickethub-mysql:3306
  TICKETHUB_REDIS_ADDR: tickethub-redis:6379
  TICKETHUB_KAFKA_BROKERS: tickethub-kafka:9092

x-app-depends: &app-depends
  tickethub-mysql:
    condition: service_healthy
  tickethub-redis:
    condition: service_healthy
  tickethub-kafka:
    condition: service_healthy

x-app-common: &app-common
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - tickethub-net

services:
  tickethub-etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: tickethub-etcd
    command:
      - /usr/local/bin/etcd
      - --name=tickethub-etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://tickethub-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://tickethub-etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=tickethub-etcd=http://tickethub-etcd:2380
      - --initial-cluster-state=new
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - tickethub_etcd_data:/etcd-data
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  tickethub-apisix:
    image: apache/apisix:3.9.0-debian
    container_name: tickethub-apisix
    depends_on:
      tickethub-etcd:
        condition: service_healthy
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?set APISIX_ADMIN_KEY in .env}
    volumes:
      - ./deploy/docker/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "127.0.0.1:9080:9080"
      - "127.0.0.1:9444:9443"
      - "127.0.0.1:${TICKETHUB_APISIX_ADMIN_PORT:-9180}:9180"
    expose:
      - "9091"
    extra_hosts:
      - "host.docker.internal:${TICKETHUB_HOST_IP:-host-gateway}"
    networks:
      - tickethub-net

  tickethub-mysql:
    image: mysql:8.4
    container_name: tickethub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${TICKETHUB_MYSQL_ROOT_PASSWORD:?set TICKETHUB_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: tickethub
      MYSQL_USER: ${TICKETHUB_MYSQL_USER:?set TICKETHUB_MYSQL_USER in .env}
      MYSQL_PASSWORD: ${TICKETHUB_MYSQL_PASSWORD:?set TICKETHUB_MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - tickethub_mysql_data:/var/lib/mysql
      - ./deploy/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  tickethub-redis:
    image: redis:7.2
    container_name: tickethub-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tickethub_redis_data:/data
      - ./deploy/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tickethub-kafka:
    image: apache/kafka:3.7.2
    container_name: tickethub-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@tickethub-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://tickethub-kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - tickethub_kafka_data:/var/lib/kafka/data
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 20

  tickethub-elasticsearch:
    image: elasticsearch:8.14.3
    container_name: tickethub-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - tickethub_es_data:/usr/share/elasticsearch/data
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  tickethub-prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tickethub-prometheus
    volumes:
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${TICKETHUB_PROMETHEUS_PORT:-19090}:9090"
    extra_hosts:
      - "host.docker.internal:${TICKETHUB_HOST_IP:-host-gateway}"
    networks:
      - tickethub-net

  tickethub-grafana:
    image: grafana/grafana:11.1.0
    container_name: tickethub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${TICKETHUB_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${TICKETHUB_GRAFANA_ADMIN_PASSWORD:?set TICKETHUB_GRAFANA_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - tickethub_grafana_data:/var/lib/grafana
      - ./deploy/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - tickethub-prometheus
    networks:
      - tickethub-net

  gateway-bff:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: gateway-bff
    image: tickethub/gateway-bff:local
    container_name: gateway-bff
    environment:
      <<: *app-env
      TICKETHUB_UPSTREAM_USER_SERVICE: http://user-service:8001
      TICKETHUB_UPSTREAM_PROGRAM_SERVICE: http://program-service:8002
      TICKETHUB_UPSTREAM_ORDER_SERVICE: http://order-service:8003
      TICKETHUB_UPSTREAM_PAY_SERVICE: http://pay-service:8004
      TICKETHUB_UPSTREAM_BASE_DATA_SERVICE: http://base-data-service:8005
      TICKETHUB_UPSTREAM_CUSTOMIZE_SERVICE: http://customize-service:8006
      TICKETHUB_UPSTREAM_ADMIN_SERVICE: http://admin-service:8007
      TICKETHUB_UPSTREAM_MIGRATE_SERVICE: http://migrate-service:8008
      TICKETHUB_GRPC_UPSTREAM_USER_SERVICE: user-service:9001
      TICKETHUB_GRPC_UPSTREAM_PROGRAM_SERVICE: program-service:9002
      TICKETHUB_GRPC_UPSTREAM_ORDER_SERVICE: order-service:9003
      TICKETHUB_GRPC_UPSTREAM_PAY_SERVICE: pay-service:9004
      TICKETHUB_GRPC_UPSTREAM_BASE_DATA_SERVICE: base-data-service:9005
      TICKETHUB_GRPC_UPSTREAM_CUSTOMIZE_SERVICE: customize-service:9006
      TICKETHUB_GRPC_UPSTREAM_ADMIN_SERVICE: admin-service:9007
      TICKETHUB_GRPC_UPSTREAM_MIGRATE_SERVICE: migrate-service:9008
    depends_on:
      <<: *app-depends
      user-service:
        condition: service_started
      program-service:
        condition: service_started
      order-service:
        condition: service_started
      pay-service:
        condition: service_started
      base-data-service:
        condition: service_started
      customize-service:
        condition: service_started
      admin-service:
        condition: service_started
      migrate-service:
        condition: service_started

  user-service:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: user-service
    image: tickethub/user-service:local
    container_name: user-service
    environment: *app-env
    depends_on: *app-depends

  program-service:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: program-service
    image: tickethub/program-service:local
    container_name: program-service
    environment:
      <<: *app-env
      TICKETHUB_ES_ADDRESSES: http://tickethub-elasticsearch:9200
      TICKETHUB_GRPC_UPSTREAM_USER_SERVICE: user-service:9001
    depends_on:
      <<: *app-depends
      tickethub-elasticsearch:
        condition: service_healthy

  order-service:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: order-service
    image: tickethub/order-service:local
    container_name: order-service
    environment:
      <<: *app-env
      TICKETHUB_GRPC_UPSTREAM_PROGRAM_SERVICE: program-service:9002
      TICKETHUB_GRPC_UPSTREAM_MIGRATE_SERVICE: migrate-service:9008
    depends_on: *app-depends

  pay-service:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: pay-service
    image: tickethub/pay-service:local
    container_name: pay-service
    environment:
      <<: *app-env
      TICKETHUB_GRPC_UPSTREAM_ORDER_SERVICE: order-service:9003
    depends_on: *app-depends

  base-data-service:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: base-data-service
    image: tickethub/base-data-service:local
    container_name: base-data-service
    environment: *app-env
    depends_on: *app-depends

  customize-service:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: customize-service
    image: tickethub/customize-service:local
    container_name: customize-service
    environment: *app-env
    depends_on: *app-depends

  admin-service:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: admin-service
    image: tickethub/admin-service:local
    container_name: admin-service
    environment:
      <<: *app-env
      TICKETHUB_GRPC_UPSTREAM_ORDER_SERVICE: order-service:9003
    depends_on: *app-depends

  migrate-service:
    <<: *app-common
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: migrate-service
    image: tickethub/migrate-service:local
    container_name: migrate-service
    environment: *app-env
    depends_on: *app-depends

networks:
  tickethub-net:
    name: tickethub-net

volumes:
  tickethub_etcd_data:
    name: tickethub_etcd_data
  tickethub_mysql_data:
    name: tickethub_mysql_data
  tickethub_redis_data:
    name: tickethub_redis_data
  tickethub_kafka_data:
    name: tickethub_kafka_data
  tickethub_es_data:
    name: tickethub_es_data
  tickethub_grafana_data:
    name: tickethub_grafana_data
