# TicketHub 9 个 Go 服务全量部署（k8s 集群内联中间件）
# 服务间调用/中间件地址通过环境变量注入集群内 Service DNS，config.yaml 默认值仅用于本地开发
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-bff
  namespace: tickethub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-bff
  template:
    metadata:
      labels:
        app: gateway-bff
    spec:
      containers:
        - name: gateway-bff
          image: tickethub/gateway-bff:local
          envFrom:
            - secretRef:
                name: tickethub-secrets
          env:
            - name: TICKETHUB_ADAPTER_MODE
              value: "infra"
            - name: TICKETHUB_REDIS_ADDR
              value: "tickethub-redis:6379"
            - name: TICKETHUB_KAFKA_BROKERS
              value: "tickethub-kafka:9092"
            - name: TICKETHUB_MYSQL_HOST
              value: "tickethub-mysql:3306"
            - name: TICKETHUB_UPSTREAM_USER_SERVICE
              value: "http://user-service:8001"
            - name: TICKETHUB_UPSTREAM_PROGRAM_SERVICE
              value: "http://program-service:8002"
            - name: TICKETHUB_UPSTREAM_ORDER_SERVICE
              value: "http://order-service:8003"
            - name: TICKETHUB_UPSTREAM_PAY_SERVICE
              value: "http://pay-service:8004"
            - name: TICKETHUB_UPSTREAM_BASE_DATA_SERVICE
              value: "http://base-data-service:8005"
            - name: TICKETHUB_UPSTREAM_CUSTOMIZE_SERVICE
              value: "http://customize-service:8006"
            - name: TICKETHUB_UPSTREAM_ADMIN_SERVICE
              value: "http://admin-service:8007"
            - name: TICKETHUB_UPSTREAM_MIGRATE_SERVICE
              value: "http://migrate-service:8008"
            - name: TICKETHUB_GRPC_UPSTREAM_USER_SERVICE
              value: "user-service:9001"
            - name: TICKETHUB_GRPC_UPSTREAM_PROGRAM_SERVICE
              value: "program-service:9002"
            - name: TICKETHUB_GRPC_UPSTREAM_ORDER_SERVICE
              value: "order-service:9003"
            - name: TICKETHUB_GRPC_UPSTREAM_PAY_SERVICE
              value: "pay-service:9004"
            - name: TICKETHUB_GRPC_UPSTREAM_BASE_DATA_SERVICE
              value: "base-data-service:9005"
            - name: TICKETHUB_GRPC_UPSTREAM_CUSTOMIZE_SERVICE
              value: "customize-service:9006"
            - name: TICKETHUB_GRPC_UPSTREAM_ADMIN_SERVICE
              value: "admin-service:9007"
            - name: TICKETHUB_GRPC_UPSTREAM_MIGRATE_SERVICE
              value: "migrate-service:9008"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-bff
  namespace: tickethub
spec:
  selector:
    app: gateway-bff
  ports:
    - name: http
      port: 8080
      targetPort: 8080
