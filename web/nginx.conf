server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # k8s 探针用
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 同源代理：浏览器请求 /api/* 由 nginx 转发到集群内 APISIX
    # 注意：nginx 启动时会立刻解析 tickethub-apisix，Service 不存在会启动失败
    location /api/ {
        proxy_pass http://tickethub-apisix:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA history 路由（vue-router createWebHistory）：文件不存在时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}